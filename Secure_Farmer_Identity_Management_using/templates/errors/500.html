{% extends "shared/base.html" %}
{% block title %}Server Error{% endblock %}
{% block body %}
<div class="auth-page" style="--auth-c1:#4a0e0e;--auth-c2:var(--danger);">
  <div class="auth-card fade-in-up">
    <div class="portal-badge" style="background:var(--danger);"><i class="bi bi-exclamation-octagon"></i></div>
    <h1 class="h4 mt-2 mb-1">500 — Something Went Wrong</h1>
    <p class="text-muted-2 mb-4" style="font-size:0.88rem;">An unexpected error occurred. Please try again, or contact your system administrator.</p>
    <a href="{{ url_for('index') }}" class="btn btn-lg w-100 btn-primary"><i class="bi bi-house me-1"></i>Back to Home</a>
  </div>
</div>
{% endblock %}
