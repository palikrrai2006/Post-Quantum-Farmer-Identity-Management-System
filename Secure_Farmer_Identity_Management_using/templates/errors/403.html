{% extends "shared/base.html" %}
{% block title %}Access Denied{% endblock %}
{% block body %}
<div class="auth-page" style="--auth-c1:#4a0e0e;--auth-c2:var(--danger);">
  <div class="auth-card fade-in-up">
    <div class="portal-badge" style="background:var(--danger);"><i class="bi bi-shield-x"></i></div>
    <h1 class="h4 mt-2 mb-1">403 — Access Denied</h1>
    <p class="text-muted-2 mb-4" style="font-size:0.88rem;">You don't have permission to view this page with your current portal login.</p>
    <a href="{{ url_for('index') }}" class="btn btn-lg w-100 btn-primary"><i class="bi bi-house me-1"></i>Back to Home</a>
  </div>
</div>
{% endblock %}
