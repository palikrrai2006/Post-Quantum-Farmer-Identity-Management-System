{% extends "shared/base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block body %}
<div class="auth-page" style="--auth-c1:var(--gov-blue-900);--auth-c2:var(--gov-blue-700);">
  <div class="auth-card fade-in-up">
    <div class="portal-badge"><i class="bi bi-signpost-2"></i></div>
    <h1 class="h4 mt-2 mb-1">404 — Page Not Found</h1>
    <p class="text-muted-2 mb-4" style="font-size:0.88rem;">The page you're looking for doesn't exist or may have moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-lg w-100 btn-primary"><i class="bi bi-house me-1"></i>Back to Home</a>
  </div>
</div>
{% endblock %}
